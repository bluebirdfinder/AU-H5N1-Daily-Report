name: HPAI Pro Daily Monitor

on:
  schedule:
    # 每天早上 9 點和下午 2 點執行 (UTC 時間 01:00 和 06:00)
    - cron: '0 1,6 * * *'
  workflow_dispatch: # 允許手動點擊執行

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予寫入權限以便 Auto-Commit status.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests playwright beautifulsoup4
          playwright install chromium

      - name: Run Monitor Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
        run: python monitor.py

      - name: Commit and Push status.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update status.json [skip ci]" && git push)
