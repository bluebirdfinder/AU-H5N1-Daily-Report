# 唯讀診斷：只在 claude/determined-hamilton-1k7gky 分支被 push 時執行，不用任何 secret、不推 commit。
name: VIC Probe
on:
  push:
    branches: [claude/determined-hamilton-1k7gky]
    paths: ['scripts/vic_probe.py', '.github/workflows/vic_probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install playwright
          playwright install chromium --with-deps
      - run: python scripts/vic_probe.py
